name: VS Code extension CI

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Repository test authority
    runs-on: ubuntu-latest

    steps:
      - name: Checkout extension repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run repository test authority in dev container
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: make test

      - name: Upload canonical VSIX
        uses: actions/upload-artifact@v4
        with:
          name: protos-vscode-vsix-${{ github.sha }}
          path: |
            protos-vscode.vsix
            protos-vscode.vsix.sha256
          if-no-files-found: error
          retention-days: 14
