name: VS Code extension CI

on:
  workflow_dispatch:

  push:

permissions:
  contents: read
  actions: read

jobs:
  package:
    name: Extension tests and VSIX package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout extension repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Run extension test suite
        run: npm test

      - name: Package raw VSIX
        run: npm run package:vsix -- --out raw.vsix

      - name: Validate raw VSIX
        run: python3 test/validate_vsix.py raw.vsix

      - name: Derive source timestamp
        id: source-date
        shell: bash
        run: |
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Canonicalize VSIX
        run: |
          node scripts/canonicalize_vsix.js \
            raw.vsix \
            protos-vscode.vsix \
            "${{ steps.source-date.outputs.epoch }}"

      - name: Verify canonical artifact
        shell: bash
        run: |
          sha256sum protos-vscode.vsix | tee protos-vscode.vsix.sha256

      - name: Verify canonical reproducibility
        run: |
          python3 test/validate_reproducibility.py raw.vsix

      - name: Upload canonical VSIX
        uses: actions/upload-artifact@v4
        with:
          name: protos-vscode-vsix-${{ github.sha }}
          path: |
            protos-vscode.vsix
            protos-vscode.vsix.sha256
          if-no-files-found: error
          retention-days: 14

  clean-install:
    name: Clean VS Code installation
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout extension repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download canonical VSIX
        uses: actions/download-artifact@v4
        with:
          name: protos-vscode-vsix-${{ github.sha }}
          path: ci-artifact

      - name: Verify canonical artifact
        working-directory: ci-artifact
        run: sha256sum --check protos-vscode.vsix.sha256

      - name: Install VS Code
        shell: bash
        run: |
          wget -qO /tmp/code.deb \
            https://update.code.visualstudio.com/latest/linux-deb-x64/stable

          sudo apt-get update
          sudo apt-get install -y /tmp/code.deb

      - name: Build clean-install harness VSIX
        run: |
          python3 test/clean_install_make_vsix.py \
            "$GITHUB_WORKSPACE/harness.vsix"

      - name: Install extension and harness
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/vscode-clean"

          mkdir -p \
            "$RUNNER_TEMP/vscode-clean/extensions" \
            "$RUNNER_TEMP/vscode-clean/user-data"

          code \
            --user-data-dir "$RUNNER_TEMP/vscode-clean/user-data" \
            --extensions-dir "$RUNNER_TEMP/vscode-clean/extensions" \
            --install-extension ci-artifact/protos-vscode.vsix \
            --force

          code \
            --user-data-dir "$RUNNER_TEMP/vscode-clean/user-data" \
            --extensions-dir "$RUNNER_TEMP/vscode-clean/extensions" \
            --install-extension harness.vsix \
            --force

      - name: Verify installed extension
        shell: bash
        run: |
          code \
            --user-data-dir "$RUNNER_TEMP/vscode-clean/user-data" \
            --extensions-dir "$RUNNER_TEMP/vscode-clean/extensions" \
            --list-extensions \
            --show-versions \
            | tee "$RUNNER_TEMP/vscode-clean/installed.txt"

          grep -q '^guillermomolina.protos@' \
            "$RUNNER_TEMP/vscode-clean/installed.txt"

      - name: Execute clean-install acceptance
        shell: bash
        env:
          PROTOS_I3_RESULT: ${{ runner.temp }}/vscode-clean/result.json
          PROTOS_I3_FIXTURE: ${{ runner.temp }}/vscode-clean/fixture.protos
        run: |
          printf 'print("clean-install")\n' > "$PROTOS_I3_FIXTURE"

          nohup code \
            --user-data-dir "$RUNNER_TEMP/vscode-clean/user-data" \
            --extensions-dir "$RUNNER_TEMP/vscode-clean/extensions" \
            --disable-gpu \
            "$PROTOS_I3_FIXTURE" \
            >/tmp/protos-vscode-clean.log 2>&1 &

          CODE_PID=$!

          for _ in $(seq 1 60); do
            test -f "$PROTOS_I3_RESULT" && break
            sleep 1
          done

          if [ ! -f "$PROTOS_I3_RESULT" ]; then
            cat /tmp/protos-vscode-clean.log || true
            kill "$CODE_PID" >/dev/null 2>&1 || true
            echo "VS_CODE_CLEAN_INSTALL_FAILED: harness produced no result"
            exit 1
          fi

          python3 \
            test/clean_install_validate.py \
            "$PROTOS_I3_RESULT"

          kill "$CODE_PID" >/dev/null 2>&1 || true

  real-run:
    name: Real Run acceptance
    needs: clean-install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout extension repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Read locked Protos revision
        id: protos-lock
        shell: bash
        run: |
          revision=$(node -e '
            const fs = require("fs");
            const lock = JSON.parse(
              fs.readFileSync("protos-source.lock.json", "utf8")
            );

            if (lock.repository !== "guillermomolina/protos") {
              throw new Error(
                `Unexpected Protos repository: ${lock.repository}`
              );
            }

            if (!/^[0-9a-f]{40}$/.test(lock.revision)) {
              throw new Error(
                `Invalid Protos revision: ${lock.revision}`
              );
            }

            process.stdout.write(lock.revision);
          ')

          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout locked Protos source
        uses: actions/checkout@v5
        with:
          repository: guillermomolina/protos
          ref: ${{ steps.protos-lock.outputs.revision }}
          path: protos-source
          fetch-depth: 1

      - name: Verify locked Protos revision
        working-directory: protos-source
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          expected="${{ steps.protos-lock.outputs.revision }}"

          test "$actual" = "$expected" || {
            echo \
              "PROTOS_SOURCE_REVISION_MISMATCH: expected=$expected actual=$actual"
            exit 1
          }

      - name: Read locked Protos toolchain
        id: protos-toolchain
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("fs");

          const toolchain = JSON.parse(
            fs.readFileSync("protos-source/toolchain.json", "utf8")
          );
          const graalvm = toolchain.graalvm;
          const components = toolchain.graal_components;

          if (graalvm === null || typeof graalvm !== "object") {
            throw new Error("Missing graalvm toolchain object");
          }
          if (components === null || typeof components !== "object") {
            throw new Error("Missing graal_components toolchain object");
          }

          function singleLineString(value, name) {
            if (
              typeof value !== "string" ||
              value.trim() === "" ||
              /[\r\n]/.test(value)
            ) {
              throw new Error(
                `Invalid ${name}: ${JSON.stringify(value)}`
              );
            }
            return value.trim();
          }

          const distribution = singleLineString(
            graalvm.distribution,
            "graalvm.distribution"
          );
          const jdkVersion = singleLineString(
            graalvm.jdk_version,
            "graalvm.jdk_version"
          );
          const release = singleLineString(
            graalvm.release,
            "graalvm.release"
          );
          const componentsVersion = singleLineString(
            components.version,
            "graal_components.version"
          );
          const jdkFeature = graalvm.jdk_feature;

          if (!Number.isInteger(jdkFeature) || jdkFeature <= 0) {
            throw new Error(
              `Invalid graalvm.jdk_feature: ${JSON.stringify(jdkFeature)}`
            );
          }
          if (release !== componentsVersion) {
            throw new Error(
              `Graal version mismatch: release=${release} components=${componentsVersion}`
            );
          }

          const match = /^(\d+)(?:[.+-]|$)/.exec(jdkVersion);
          const versionFeature = match ? Number(match[1]) : NaN;
          if (versionFeature !== jdkFeature) {
            throw new Error(
              `JDK feature mismatch: feature=${jdkFeature} version=${jdkVersion}`
            );
          }

          process.stdout.write(`distribution=${distribution}\n`);
          process.stdout.write(`jdk_version=${jdkVersion}\n`);
          process.stdout.write(`jdk_feature=${jdkFeature}\n`);
          process.stdout.write(`graalvm_release=${release}\n`);
          NODE

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ steps.protos-toolchain.outputs.distribution }}
          java-version: ${{ steps.protos-toolchain.outputs.jdk_version }}

      - name: Verify canonical Java runtime
        shell: bash
        env:
          PROTOS_SOURCE_REVISION: ${{ steps.protos-lock.outputs.revision }}
          PROTOS_GRAALVM_DISTRIBUTION: ${{ steps.protos-toolchain.outputs.distribution }}
          PROTOS_GRAALVM_RELEASE: ${{ steps.protos-toolchain.outputs.graalvm_release }}
          PROTOS_JAVA_VERSION: ${{ steps.protos-toolchain.outputs.jdk_version }}
        run: |
          actual=$(
            java -XshowSettings:properties -version 2>&1 \
              | sed -n 's/^[[:space:]]*java.version = //p' \
              | head -n 1
          )

          if [ -z "$actual" ] || [ "$actual" != "$PROTOS_JAVA_VERSION" ]; then
            echo \
              "CANONICAL_JAVA_RUNTIME_FAILED: expected=$PROTOS_JAVA_VERSION actual=$actual"
            exit 1
          fi

          echo "PROTOS_SOURCE_REVISION=$PROTOS_SOURCE_REVISION"
          echo "PROTOS_GRAALVM_DISTRIBUTION=$PROTOS_GRAALVM_DISTRIBUTION"
          echo "PROTOS_GRAALVM_RELEASE=$PROTOS_GRAALVM_RELEASE"
          echo "PROTOS_JAVA_VERSION=$PROTOS_JAVA_VERSION"
          echo "ACTUAL_JAVA_VERSION=$actual"
          echo "CANONICAL_JAVA_RUNTIME=PASS"

      - name: Build locked Protos runtime
        working-directory: protos-source
        run: mvn -q -DskipTests package

      - name: Download canonical VSIX
        uses: actions/download-artifact@v4
        with:
          name: protos-vscode-vsix-${{ github.sha }}
          path: ci-artifact

      - name: Verify canonical artifact
        working-directory: ci-artifact
        run: sha256sum --check protos-vscode.vsix.sha256

      - name: Install VS Code and Xvfb
        shell: bash
        run: |
          wget -qO /tmp/code.deb \
            https://update.code.visualstudio.com/latest/linux-deb-x64/stable

          sudo apt-get update
          sudo apt-get install -y /tmp/code.deb xvfb

      - name: Build real-run harness VSIX
        run: |
          python3 test/clean_run_make_vsix.py \
            "$GITHUB_WORKSPACE/harness.vsix"

      - name: Install extension and harness
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/vscode-run"

          mkdir -p \
            "$RUNNER_TEMP/vscode-run/extensions" \
            "$RUNNER_TEMP/vscode-run/user-data"

          code \
            --user-data-dir "$RUNNER_TEMP/vscode-run/user-data" \
            --extensions-dir "$RUNNER_TEMP/vscode-run/extensions" \
            --install-extension ci-artifact/protos-vscode.vsix \
            --force

          code \
            --user-data-dir "$RUNNER_TEMP/vscode-run/user-data" \
            --extensions-dir "$RUNNER_TEMP/vscode-run/extensions" \
            --install-extension harness.vsix \
            --force

      - name: Execute Run Current File acceptance
        shell: bash
        env:
          PROTOS_I3B_RESULT: ${{ runner.temp }}/vscode-run/result.json
          PROTOS_I3B_FIXTURE: ${{ runner.temp }}/vscode-run/fixture.protos
          PROTOS_I3B_RUNTIME: ${{ github.workspace }}/protos-source/bin/protos
        run: |
          printf 'print("VS_CODE_RUN")\n' > "$PROTOS_I3B_FIXTURE"

          xvfb-run -a code \
            --user-data-dir "$RUNNER_TEMP/vscode-run/user-data" \
            --extensions-dir "$RUNNER_TEMP/vscode-run/extensions" \
            "$PROTOS_I3B_FIXTURE" \
            >/tmp/protos-vscode-run.log 2>&1 &

          CODE_PID=$!

          for _ in $(seq 1 90); do
            test -f "$PROTOS_I3B_RESULT" && break
            sleep 1
          done

          if [ ! -f "$PROTOS_I3B_RESULT" ]; then
            cat /tmp/protos-vscode-run.log || true
            kill "$CODE_PID" >/dev/null 2>&1 || true
            echo "VS_CODE_REAL_RUN_FAILED: no result"
            exit 1
          fi

          python3 \
            test/clean_run_validate.py \
            "$PROTOS_I3B_RESULT"

          kill "$CODE_PID" >/dev/null 2>&1 || true

  real-debug:
    name: Real Debug acceptance
    needs: real-run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout extension repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Read locked Protos revision
        id: protos-lock
        shell: bash
        run: |
          revision=$(node -e '
            const fs = require("fs");
            const lock = JSON.parse(
              fs.readFileSync("protos-source.lock.json", "utf8")
            );

            if (lock.repository !== "guillermomolina/protos") {
              throw new Error(
                `Unexpected Protos repository: ${lock.repository}`
              );
            }

            if (!/^[0-9a-f]{40}$/.test(lock.revision)) {
              throw new Error(
                `Invalid Protos revision: ${lock.revision}`
              );
            }

            process.stdout.write(lock.revision);
          ')

          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout locked Protos source
        uses: actions/checkout@v5
        with:
          repository: guillermomolina/protos
          ref: ${{ steps.protos-lock.outputs.revision }}
          path: protos-source
          fetch-depth: 1

      - name: Verify locked Protos revision
        working-directory: protos-source
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          expected="${{ steps.protos-lock.outputs.revision }}"

          test "$actual" = "$expected" || {
            echo \
              "PROTOS_SOURCE_REVISION_MISMATCH: expected=$expected actual=$actual"
            exit 1
          }

      - name: Read locked Protos toolchain
        id: protos-toolchain
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("fs");

          const toolchain = JSON.parse(
            fs.readFileSync("protos-source/toolchain.json", "utf8")
          );
          const graalvm = toolchain.graalvm;
          const components = toolchain.graal_components;

          if (graalvm === null || typeof graalvm !== "object") {
            throw new Error("Missing graalvm toolchain object");
          }
          if (components === null || typeof components !== "object") {
            throw new Error("Missing graal_components toolchain object");
          }

          function singleLineString(value, name) {
            if (
              typeof value !== "string" ||
              value.trim() === "" ||
              /[\r\n]/.test(value)
            ) {
              throw new Error(
                `Invalid ${name}: ${JSON.stringify(value)}`
              );
            }
            return value.trim();
          }

          const distribution = singleLineString(
            graalvm.distribution,
            "graalvm.distribution"
          );
          const jdkVersion = singleLineString(
            graalvm.jdk_version,
            "graalvm.jdk_version"
          );
          const release = singleLineString(
            graalvm.release,
            "graalvm.release"
          );
          const componentsVersion = singleLineString(
            components.version,
            "graal_components.version"
          );
          const jdkFeature = graalvm.jdk_feature;

          if (!Number.isInteger(jdkFeature) || jdkFeature <= 0) {
            throw new Error(
              `Invalid graalvm.jdk_feature: ${JSON.stringify(jdkFeature)}`
            );
          }
          if (release !== componentsVersion) {
            throw new Error(
              `Graal version mismatch: release=${release} components=${componentsVersion}`
            );
          }

          const match = /^(\d+)(?:[.+-]|$)/.exec(jdkVersion);
          const versionFeature = match ? Number(match[1]) : NaN;
          if (versionFeature !== jdkFeature) {
            throw new Error(
              `JDK feature mismatch: feature=${jdkFeature} version=${jdkVersion}`
            );
          }

          process.stdout.write(`distribution=${distribution}\n`);
          process.stdout.write(`jdk_version=${jdkVersion}\n`);
          process.stdout.write(`jdk_feature=${jdkFeature}\n`);
          process.stdout.write(`graalvm_release=${release}\n`);
          NODE

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ steps.protos-toolchain.outputs.distribution }}
          java-version: ${{ steps.protos-toolchain.outputs.jdk_version }}

      - name: Verify canonical Java runtime
        shell: bash
        env:
          PROTOS_SOURCE_REVISION: ${{ steps.protos-lock.outputs.revision }}
          PROTOS_GRAALVM_DISTRIBUTION: ${{ steps.protos-toolchain.outputs.distribution }}
          PROTOS_GRAALVM_RELEASE: ${{ steps.protos-toolchain.outputs.graalvm_release }}
          PROTOS_JAVA_VERSION: ${{ steps.protos-toolchain.outputs.jdk_version }}
        run: |
          actual=$(
            java -XshowSettings:properties -version 2>&1 \
              | sed -n 's/^[[:space:]]*java.version = //p' \
              | head -n 1
          )

          if [ -z "$actual" ] || [ "$actual" != "$PROTOS_JAVA_VERSION" ]; then
            echo \
              "CANONICAL_JAVA_RUNTIME_FAILED: expected=$PROTOS_JAVA_VERSION actual=$actual"
            exit 1
          fi

          echo "PROTOS_SOURCE_REVISION=$PROTOS_SOURCE_REVISION"
          echo "PROTOS_GRAALVM_DISTRIBUTION=$PROTOS_GRAALVM_DISTRIBUTION"
          echo "PROTOS_GRAALVM_RELEASE=$PROTOS_GRAALVM_RELEASE"
          echo "PROTOS_JAVA_VERSION=$PROTOS_JAVA_VERSION"
          echo "ACTUAL_JAVA_VERSION=$actual"
          echo "CANONICAL_JAVA_RUNTIME=PASS"

      - name: Build locked Protos runtime
        working-directory: protos-source
        run: mvn -q -DskipTests package

      - name: Download canonical VSIX
        uses: actions/download-artifact@v4
        with:
          name: protos-vscode-vsix-${{ github.sha }}
          path: ci-artifact

      - name: Verify canonical artifact
        working-directory: ci-artifact
        run: sha256sum --check protos-vscode.vsix.sha256

      - name: Install VS Code and Xvfb
        shell: bash
        run: |
          wget -qO /tmp/code.deb \
            https://update.code.visualstudio.com/latest/linux-deb-x64/stable

          sudo apt-get update
          sudo apt-get install -y /tmp/code.deb xvfb

      - name: Build debug harness VSIX
        run: |
          python3 test/debug_harness_make_vsix.py \
            "$GITHUB_WORKSPACE/debug-harness.vsix"

      - name: Install extension and debug harness
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/vscode-debug"

          mkdir -p \
            "$RUNNER_TEMP/vscode-debug/extensions" \
            "$RUNNER_TEMP/vscode-debug/user-data"

          code \
            --user-data-dir "$RUNNER_TEMP/vscode-debug/user-data" \
            --extensions-dir "$RUNNER_TEMP/vscode-debug/extensions" \
            --install-extension ci-artifact/protos-vscode.vsix \
            --force

          code \
            --user-data-dir "$RUNNER_TEMP/vscode-debug/user-data" \
            --extensions-dir "$RUNNER_TEMP/vscode-debug/extensions" \
            --install-extension debug-harness.vsix \
            --force

      - name: Execute real debugger acceptance
        shell: bash
        env:
          PROTOS_I3C_RESULT: ${{ runner.temp }}/vscode-debug/result.json
          PROTOS_I3C_FIXTURE: ${{ runner.temp }}/vscode-debug/debug_fixture.protos
          PROTOS_I3C_RUNTIME: ${{ github.workspace }}/protos-source/bin/protos
        run: |
          mkdir -p "$RUNNER_TEMP/vscode-debug"

          cat > "$PROTOS_I3C_FIXTURE" <<'EOF'
          x: 41
          print(x)
          print("done")
          EOF

          xvfb-run -a code \
            --user-data-dir "$RUNNER_TEMP/vscode-debug/user-data" \
            --extensions-dir "$RUNNER_TEMP/vscode-debug/extensions" \
            --new-window \
            "$PROTOS_I3C_FIXTURE" \
            >/tmp/protos-vscode-debug.log 2>&1 &

          CODE_PID=$!

          for _ in $(seq 1 120); do
            test -f "$PROTOS_I3C_RESULT" && break
            sleep 1
          done

          if [ ! -f "$PROTOS_I3C_RESULT" ]; then
            cat /tmp/protos-vscode-debug.log || true
            kill "$CODE_PID" >/dev/null 2>&1 || true
            echo "VS_CODE_REAL_DEBUG_FAILED: no result"
            exit 1
          fi

          python3 \
            test/debug_harness_validate.py \
            "$PROTOS_I3C_RESULT"

          kill "$CODE_PID" >/dev/null 2>&1 || true

          BAD_OPTION="--extensionDevelopment""Path"

          if grep -q -- "$BAD_OPTION" /tmp/protos-vscode-debug.log; then
            echo \
              "VS_CODE_REAL_DEBUG_FAILED: forbidden development-path option detected"
            exit 1
          fi
